# Релиз собирается здесь, а не на машине разработчика: exe в релизе = этот исходник на этом теге.
# Запуск: git tag v1.2.3 && git push origin v1.2.3
# Моды берутся по mods/manifest.json (ссылки + sha256), проверяются и вкладываются в exe;
# в релиз кладутся exe, его sha256 и сами моды отдельными файлами.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Версия из тега
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "tag must be vX.Y.Z, got $tag" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Сборка exe
        shell: pwsh
        run: dotnet publish src/PWRuLauncher.App/PWRuLauncher.App.csproj -c Release -o dist/raw -p:Version=${{ steps.ver.outputs.version }}

      - name: Моды по манифесту (скачать и сверить sha256)
        shell: pwsh
        run: python tools/fetch_mods.py mods/manifest.json dist/mods

      - name: Бандл в хвост exe
        shell: pwsh
        run: |
          python tools/pack.py --voice dist/mods/PW_RU_Voice.pak --subs dist/mods/PW_RU_Subs.pak --ue4ss dist/mods/PW_RU_UE4SS.zip `
            --version ${{ steps.ver.outputs.version }} --out dist/payload.zip `
            --exe dist/raw/PWRuLauncher.exe --exe-out dist/PWRuLauncher.exe
          $sha = (Get-FileHash dist/PWRuLauncher.exe -Algorithm SHA256).Hash.ToLower()
          "$sha  PWRuLauncher.exe" | Out-File -Encoding ascii -NoNewline dist/PWRuLauncher.exe.sha256
          Get-Content dist/PWRuLauncher.exe.sha256

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            dist/PWRuLauncher.exe
            dist/PWRuLauncher.exe.sha256
            dist/mods/PW_RU_Voice.pak
            dist/mods/PW_RU_Subs.pak
            dist/mods/PW_RU_UE4SS.zip
